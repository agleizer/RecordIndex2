services:

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    volumes:
      - ./src:/app/src                  # hot-reload do código em dev
      - ./prompts.yaml:/app/prompts.yaml  # prompts editáveis sem rebuild
      - ./volumes/input:/data/input     # imagens de entrada
      - ./volumes/output:/data/output   # resultados do pipeline
      - ./volumes/samples:/data/samples # imagens de teste
      - docufcn_models:/models/huggingface  # modelo doc-UFCN persistido
    env_file:
      - .env
    environment:
      - HF_HOME=/models/huggingface     # huggingface_hub lê daqui
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      docufcn-init:
        condition: service_completed_successfully
    networks:
      - recordindex

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama       # named volume — persiste modelos entre runs
    ports:
      - "11435:11434"                   # host:11435 → evita conflito com Ollama local no Windows
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - recordindex
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    env_file:
      - .env
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        echo "Pulling models: $OLLAMA_MODELS_PULL"
        echo "$OLLAMA_MODELS_PULL" | tr ',' '\n' | while read -r model; do
          echo "==> ollama pull $$model"
          ollama pull "$$model"
        done
        echo "All models ready."
    restart: "no"
    networks:
      - recordindex

  docufcn-init:
    # Baixa o modelo doc-UFCN na primeira inicialização.
    # Execuções seguintes pulam o download (modelo já está em docufcn_models).
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    volumes:
      - docufcn_models:/models/huggingface
      - ./docker:/docker                        # acesso ao script de init
    environment:
      - HF_HOME=/models/huggingface
    command: ["python", "/docker/docufcn_init.py"]
    restart: "no"
    networks:
      - recordindex

  eval:
    # Serviço de avaliação offline — compara output do pipeline com índice arquivístico.
    # Sem GPU, sem Ollama, sem dependências pesadas.
    # Porta 8001 — Swagger em http://localhost:8001/docs
    build:
      context: .
      dockerfile: evaluation/Dockerfile
    ports:
      - "8001:8001"
    networks:
      - recordindex

networks:
  recordindex:
    driver: bridge

volumes:
  ollama_data:
  docufcn_models:    # modelo 'generic-historical-line' do HuggingFace
