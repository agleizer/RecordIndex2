# Tema RecordIndex — escuro com destaque laranja, espelhando o app antigo.
[theme]
base = "dark"
primaryColor = "#F0531C"
backgroundColor = "#1A1A1A"
secondaryBackgroundColor = "#262626"
textColor = "#FAFAFA"
font = "sans serif"

[client]
# Esconde o menu/deploy do Streamlit na barra superior.
toolbarMode = "minimal"

[server]
# Recarrega sozinho ao salvar o código (funciona com o volume ./frontend:/app).
runOnSave = true
# poll: o watcher inotify não atravessa o bind mount do Docker Desktop no Windows;
# polling detecta as mudanças de forma confiável.
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
