a0:
  classify_from_template: |
    Você é um especialista em manuscritos históricos genealógicos em português brasileiro.

    O usuário forneceu um molde de texto (template) usado para corrigir registros desta coleção.
    Analise o molde e determine:
    1. O tipo do registro: batismo, casamento ou obito
    2. A expressão típica de início de um novo registro (geralmente a primeira palavra ou frase fixa do molde)
    3. Breve justificativa

    Nome da coleção: {collection_name}
    Ano: {year}
    Local: {location}

    Molde de referência:
    {record_template}

  classify: |
    Você é um especialista em manuscritos históricos genealógicos em português brasileiro.

    Nome da coleção: {collection_name}
    Ano: {year}
    Local: {location}

    Primeiras linhas transcritas:
    {lines_fmt}

    Com base nesses dados, determine:
    1. O tipo do registro: batismo, casamento ou obito
    2. A expressão típica de início de um novo registro nesta coleção
    3. Breve justificativa

a6:
  validate: |
    Você está validando a extração de campos de um registro de {collection_type}
    de manuscrito histórico em português brasileiro.

    Texto original do registro (transcrição HTR, pode conter erros):
    {record_text}

    Campos extraídos pelo sistema:
    {structured_output}

    Erros detectados automaticamente pelas regras:
    {field_errors}

    Analise se os campos extraídos fazem sentido para este tipo de registro histórico.
    Considere que o texto pode ter erros de transcrição, mas os campos extraídos devem
    ser coerentes com o conteúdo do registro.

    Confirme os erros detectados, descarte os que forem falsos positivos, e identifique
    outros problemas não detectados pelas regras. Seja conciso e objetivo.

a2:
  transcribe: |
    Você é um especialista em transcrição de manuscritos históricos em português brasileiro.
    Transcreva exatamente o texto manuscrito presente nesta imagem de linha.
    Preserve a ortografia original, mesmo que arcaica.
    Se não conseguir ler alguma palavra, use [?] no lugar.
    Retorne APENAS o texto transcrito, sem explicações.

  transcribe_page: |
    Você é um especialista em transcrição de manuscritos históricos em português brasileiro.

    Transcreva todas as linhas de texto visíveis nesta página de manuscrito, de cima para baixo.

    Regras:
    - Retorne uma linha de texto por linha da sua resposta.
    - Preserve a ortografia original, mesmo que arcaica.
    - Se uma linha for ilegível, retorne [?] para aquela linha.
    - NÃO adicione numeração, marcadores, explicações ou linhas em branco extras.
    - Inclua apenas linhas com texto manuscrito — ignore ornamentos, selos ou margens em branco.

a3:
  segment_page: |
    Você está analisando a transcrição de uma página de manuscrito histórico em português brasileiro.
    Tipo de coleção: {collection_type} ({collection_name}).
    {template_section}
    Cada novo registro começa quando o texto introduz um novo ato eclesiástico — tipicamente
    com uma expressão de data ("Aos X dias", "No primeiro dia", "Em X de mês", ou equivalentes).
    O exemplo de início para esta coleção é: '{record_start_hint}', mas variações semânticas
    equivalentes devem ser reconhecidas.
    {avg_lines_hint_section}
    As transcrições podem conter erros de HTR (palavras deformadas, letras trocadas).
    Raciocine sobre o conteúdo semântico, não sobre a grafia exata.

    Abaixo está o texto completo da página (transcrição contínua):

    {page_text}

    Divida o texto acima nos registros genealógicos individuais que ele contém.
    Retorne o texto de cada registro integralmente, preservando a transcrição original.
    Linhas de frontispício, cabeçalho ou índice que precedem o primeiro registro devem ser ignoradas.
    Se a página não contiver nenhum registro, retorne lista vazia.
    Retorne também um breve raciocínio sobre como identificou as fronteiras entre registros.

  segment: |
    Você está analisando transcrições de manuscritos históricos em português brasileiro.
    Tipo de coleção: {collection_type} ({collection_name}).
    {template_section}
    Cada novo registro começa quando o texto introduz um novo ato eclesiástico — tipicamente
    com uma expressão de data ("Aos X dias", "No primeiro dia", "Em X de mês", ou equivalentes).
    O exemplo de início para esta coleção é: '{record_start_hint}', mas variações semânticas
    equivalentes devem ser reconhecidas da mesma forma.
    {avg_lines_hint_section}
    As transcrições podem conter erros de HTR (palavras deformadas, letras trocadas).
    Raciocine sobre o conteúdo semântico, não sobre a grafia exata.

    Abaixo estão as linhas transcritas, numeradas de 0 a {last_index}:

    {numbered_lines}

    Identifique quais índices iniciam um novo registro genealógico.
    Linhas anteriores ao primeiro registro (frontispício, cabeçalhos, índices) devem ser ignoradas — retorne lista vazia se a página não contiver nenhum registro.
    Retorne a lista de índices de início e um breve raciocínio.

a4:
  correct: |
    Você é um especialista em correção de manuscritos históricos em português brasileiro.

    Sua tarefa é preencher os placeholders de um molde de referência com as informações
    extraídas de um texto com erros de transcrição (HTR automático).

    Regras:
    - Mantenha o texto fixo do molde exatamente como está.
    - Substitua apenas os placeholders (marcados com <NOME>) pelos dados extraídos do texto.
    - Se um trecho marcado como opcional (<OPT>...</OPT> ou <VAR>...</VAR>) não tiver
      correspondência no texto, remova-o junto com as suas tags de abertura e fechamento.
      Se o trecho tiver correspondência, mantenha o conteúdo e remova apenas as tags.
    - Preserve nomes próprios exatamente como aparecem no texto — não "corrija" grafias de nomes.
    - Se um placeholder não puder ser preenchido, mantenha-o como está no molde.
    - Retorne APENAS o texto corrigido, sem explicações, notas ou comentários.

    Molde de referência:
    {record_template}

    Texto com erros:
    {text}

  correct_fallback: |
    Preencha cada placeholder do MOLDE com o valor correspondente extraído do TEXTO.
    Placeholders são marcados com sinais de menor/maior: <ASSIM>.

    EXEMPLO:
    MOLDE: "Aos <DIA> dias de <MES> de <ANO>, batizei <NOME>, filho de <PAI> e <MAE>."
    TEXTO: "Aos tres dias de Janeiro do anno de 1863 baptisei Rosa filha de João Fran cisco de Freitas e Luiza Joaquina"
    RESULTADO CORRETO: "Aos tres dias de Janeiro de 1863, batizei Rosa, filho de João Fran cisco de Freitas e Luiza Joaquina."

    Agora faça o mesmo com o MOLDE e TEXTO abaixo.
    Substitua TODOS os placeholders <ASSIM> pelos valores do TEXTO.
    Trechos entre <OPT>...</OPT> ou <VAR>...</VAR> são opcionais: mantenha o conteúdo
    (sem as tags) se tiver correspondência no texto; remova o trecho inteiro se não tiver.
    Retorne APENAS o resultado preenchido, sem explicações.

    MOLDE:
    {record_template}

    TEXTO:
    {text}

# Descrições de campos por tipo de coleção — usadas pelo A5 no prompt de extração.
# Editável sem rebuild. Inclua a expressão âncora para guiar a extração no texto manuscrito.
field_descriptions:
  batismo:
    nome: "nome da pessoa batizada — aparece após 'dei o nome de' no texto"
    pai:  "nome do pai da pessoa batizada — aparece após 'filho/a legítimo/a de'"
    mae:  "nome da mãe da pessoa batizada — aparece após 'e de sua Mulher'"
    data: "data do batismo (dia, mês e ano) — aparece no início do registro"
  casamento:
    noivo:      "nome do noivo"
    noiva:      "nome da noiva"
    pai_noivo:  "nome do pai do noivo"
    mae_noivo:  "nome da mãe do noivo"
    pai_noiva:  "nome do pai da noiva"
    mae_noiva:  "nome da mãe da noiva"
    data:       "data do casamento (dia, mês e ano) — aparece no início do registro"
  obito:
    nome:  "nome da pessoa falecida"
    pai:   "nome do pai da pessoa falecida"
    mae:   "nome da mãe da pessoa falecida"
    data:  "data do óbito (dia, mês e ano) — aparece no início do registro"
    idade: "idade da pessoa falecida"

a5:
  extract: |
    Você está extraindo informações de um registro de {collection_type} de manuscrito
    histórico em português brasileiro.

    Texto do registro:
    {record_text}

    Extraia os seguintes campos:
    {field_list}

    Regras importantes:
    - Cada campo tem uma expressão âncora no texto — use-a para localizar o valor correto.
    - O texto pode conter anotações de margem, nomes de avós, padrinhos e assinatura do
      vigário. Extraia APENAS a entidade indicada pela descrição do campo, ignorando as demais.
    - Para o campo data: extraia apenas o dia, mês e ano em formato curto (ex: "4 de Janeiro
      de 1863"). Não inclua o texto narrativo completo do registro.
    - Se um campo não estiver presente no texto, use string vazia.
    - Preserve os nomes exatamente como aparecem no texto, sem corrigir ortografia.

# Prompts do módulo generalista (AG + AM) — modo de pipeline alternativo ao MAS,
# usado para comparar decomposição em agentes vs. um único agente fazendo tudo.
# Não é lido por nenhum agente A0-A6, ver src/agents/ag_generalist.py e am_merge.py.
generalist:
  single_prompt: |
    Você é um especialista em transcrição e extração de dados de manuscritos
    históricos genealógicos em português. Você recebeu a imagem de uma página
    inteira de um livro paroquial manuscrito.

    Nome da coleção: {collection_name}
    Tipo de registro: {collection_type}
    {template_section}
    Realize as tarefas abaixo em uma única análise da imagem.

    1. LEITURA
    - Leia todo o texto manuscrito visível na página, de cima para baixo.
    - Preserve a ortografia original, mesmo que arcaica.
    - Se um trecho for genuinamente ilegível, use [?] no lugar dele — mas tente
      ler mesmo quando a caligrafia for difícil ou a tinta estiver desbotada.
      NÃO descreva a condição física do papel (ex.: "tinta repassada",
      "manchado", "borrão") em vez de transcrever o conteúdo.
    - Ignore ornamentos, selos, carimbos e margens em branco sem texto.

    2. SEGMENTAÇÃO
    - Cada novo registro começa quando o texto introduz um novo ato
      eclesiástico, tipicamente com uma expressão de data ("Aos X dias", "No
      primeiro dia", "Em X de mês", ou equivalentes). O exemplo de início para
      esta coleção é '{record_start_hint}', mas reconheça variações semânticas
      equivalentes, mesmo com possível erro de leitura.
    - Se o texto no TOPO da página não começa com uma nova expressão de data
      (ou seja, parece continuação de um registro que começou na página
      anterior), retorne esse trecho em leading_continuation_text e NÃO o
      inclua em nenhum registro de records. Se a página inteira for
      continuação (nenhum novo registro começa nela), records deve ficar
      vazio e leading_continuation_text deve conter a página inteira.
    - Linhas de frontispício, cabeçalho, índice ou numeração de página que
      precedem o primeiro registro (e que não são continuação de nada) não
      formam um registro nem continuação — ignore-as.
    - Raciocine sobre o conteúdo semântico do texto, não sobre a grafia exata.

    3. EXTRAÇÃO
    Para cada registro identificado em records, extraia os campos:
    {field_list}

    Regras de extração:
    - Cada campo tem uma expressão-âncora no texto — use-a para localizar o
      valor correto.
    - O registro pode conter anotações de margem, nomes de avós, padrinhos e
      assinatura do vigário. Extraia APENAS a entidade indicada pela descrição
      de cada campo, ignorando as demais pessoas mencionadas.
    - Para o campo data: extraia apenas dia, mês e ano em formato curto (ex.:
      "4 de Janeiro de 1863"), não o texto narrativo completo do registro.
    - Se um campo não estiver presente no registro, retorne string vazia.
    - Preserve os nomes exatamente como aparecem no texto, sem corrigir
      ortografia.

    4. COMPLETUDE
    Para cada registro em records, marque complete=false se o texto do
    registro parece cortado pela borda INFERIOR da página: falta a fórmula
    de fechamento esperada, ou campos que este tipo de registro normalmente
    contém (ex.: pai/mãe em batismo) estão claramente ausentes do texto
    visível, não porque o manuscrito não os informa, mas porque o registro
    continua além do que esta imagem mostra. Marque complete=true em todos
    os demais casos, inclusive quando um campo está genuinamente ausente no
    manuscrito.

    Para cada registro, retorne o texto transcrito completo dele (raw_text)
    e os campos extraídos. Inclua também um breve raciocínio geral sobre como
    você dividiu a página em registros e continuações.

  merge: |
    Você recebe dois fragmentos de um registro genealógico manuscrito de
    {collection_type} que foi cortado pela borda entre duas páginas.

    FRAGMENTO A — início do registro, extraído da página anterior:
    Texto: {fragment_a_text}
    Campos já extraídos: {fragment_a_fields}

    FRAGMENTO B — texto encontrado no topo da página seguinte, antes de
    qualquer novo início de registro detectado ali:
    Texto: {fragment_b_text}

    Primeiro, confirme se o Fragmento B é de fato a continuação do mesmo
    registro do Fragmento A (mesma pessoa, mesmo ato religioso). É possível
    que a segmentação da página anterior tenha errado o corte e o Fragmento A
    já estivesse completo, isso deve ser tratado como is_continuation=false.

    Se NÃO for continuação, retorne is_continuation=false, merged_raw_text
    igual ao Fragmento A sem alteração, e merged_fields igual aos campos já
    extraídos do Fragmento A sem alteração.

    Se for continuação, produza os campos finais combinando as duas partes:
    {field_list}

    Regras:
    - Para cada campo, use o valor não vazio disponível entre os dois
      fragmentos (o Fragmento B pode conter informação que faltava no A, como
      pai/mãe). Se ambos os fragmentos tiverem valor não vazio e diferente
      para o mesmo campo, prefira o valor com a expressão-âncora mais clara
      no texto combinado, e registre o conflito no campo reasoning.
    - Não invente valor para nenhum campo — string vazia se nenhum dos dois
      fragmentos tiver a informação.
    - merged_raw_text: concatene o texto do Fragmento A com o do Fragmento B,
      na ordem, sem duplicar trechos que já apareçam nos dois.
